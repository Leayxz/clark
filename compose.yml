services:

  web:
    image: ghcr.io/leayxz/clark:latest
    container_name: clark_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env.docker
    depends_on:
      - postgresql
      - redis
    volumes:
    - static_data:/app/staticfiles


  nginx:
    image: nginx:alpine
    container_name: clark_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - static_data:/staticfiles
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/certs:ro


  postgresql:
    image: postgres:15
    ports:
      - "5432:5432"
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8
    ports:
      - "6379:6379"
    env_file:
      - .env.docker



  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"


  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./telemetry/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"


  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"


  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"


  collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./telemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"


volumes:
  postgres_data:
  static_data:
