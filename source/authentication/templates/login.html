{% load static %}


<link rel="stylesheet" href="{% static 'login.css' %}">

<div class="clark-login-wrap">

    <!-- Brand -->
    <div class="clark-login-brand">
        <div class="clark-login-brand-name">Clark 丰</div>
        <div class="clark-login-brand-tagline">Automatize sua estratégia. Mantenha o controle.</div>
    </div>

    <!-- Login Card -->
    <div class="clark-login-card">
        <div class="clark-login-title">Bem-Vindo de Volta!</div>

        <form id="authentication_form" method="post"> {% csrf_token %}

            <div class="clark-field">
                <label class="clark-field-label" for="email">Email</label>
                <input class="clark-input" type="email" id="email" name="email" placeholder="exemplo@proton.me" required>
            </div>

            <div class="clark-field">
                <label class="clark-field-label" for="password">Senha</label>
                <input class="clark-input" type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <p class="clark_login_error_message" id="clark_login_error"></p>
            <button class="clark-btn clark-btn-primary" type="submit">Entrar</button>

            <div class="clark-login-divider">
                <div class="clark-login-divider-line"></div>
                <span class="clark-login-divider-text">ou</span>
                <div class="clark-login-divider-line"></div>
            </div>

            <div class="clark-login-secondary">Ainda não tem conta? <a href="/register/">Registrar</a> </div>
        </form>
    </div>

    <!-- Trust Signals -->
    <div class="clark-login-trust">
        <div class="clark-login-trust-items">

            <div class="clark-login-trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Suas chaves, seu controle. Sem custódia dos seus fundos.
            </div>

            <div class="clark-login-trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                O Clark nunca solicita saques ou transferências.
            </div>
        </div>
    </div>

</div>

<script type="module" src="{% static 'javascript/login.js' %}"></script>
