{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Clark — crie sua conta e automatize sua estratégia de Bitcoin mantendo controle total, visibilidade e non-custódia.">
<title>Clark — Cadastro</title>
<link rel="stylesheet" href="{% static 'register.css' %}">
</head>
<body>

<div class="clark-register-wrap">

    <!-- Brand -->
    <div class="clark-register-brand">
        <div class="clark-register-brand-name">Clark 丰</div>
        <div class="clark-register-brand-tagline">Automatize sua estratégia. Mantenha o controle.</div>
    </div>

    <!-- --------------------------------------------- Registration Card --------------------------------------------- -->

    <div class="clark-register-card">
        <div class="clark-register-title">Cadastro</div>

        <form id="register_form" method="post"> {% csrf_token %}

            <div class="clark-field">
                <label class="clark-field-label" for="email">Email</label>
                <input class="clark-input" type="email" id="email" name="email"
                       placeholder="seu@email.com" required
                       value="{{ request.POST.email|default:'' }}">
            </div>

            <div class="clark-field">
                <label class="clark-field-label" for="password">Senha</label>
                <input class="clark-input" type="password" id="password" name="password" minlength="8" placeholder="mínimo 8 caracteres" required>
                <div class="clark-password-strength">
                    <div class="clark-password-strength-bar" id="strength-bar"></div>
                </div>
                <div class="clark-password-hint">Use letras, números e símbolos</div>
            </div>

            <div class="clark-field">
                <label class="clark-field-label" for="confirmed_password">Confirmação</label>
                <input class="clark-input" type="password" id="confirmed_password" name="confirmed_password" placeholder="repita sua senha" required>
            </div>

            <div class="clark-register-terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label class="clark-register-terms-label" for="terms"> Li e aceito os <a href="">termos de uso</a> e a <a href="">política de privacidade</a> </label>
            </div>

            <p class="clark_register_error_show" id="register_error_show"></p>
            <button class="clark-btn clark-btn-primary" type="submit">Registrar</button>

            <div class="clark-register-divider">
                <div class="clark-register-divider-line"></div>
                <span class="clark-register-divider-text">ou</span>
                <div class="clark-register-divider-line"></div>
            </div>

            <div class="clark-register-secondary">Já tem uma conta? <a href="/login/">Entrar</a>
            </div>
        </form>
    </div>



    <!-- --------------------------------------------- Trust Pills --------------------------------------------- -->

    <div class="clark-register-trust">
        <div class="clark-register-trust-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Não Custodial
        </div>
        <div class="clark-register-trust-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            Visibilidade Completa
        </div>
        <div class="clark-register-trust-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Você no Controle
        </div>
    </div>

</div>


<script type="module" src="{% static 'javascript/register.js' %}"></script>

</body>
</html>
